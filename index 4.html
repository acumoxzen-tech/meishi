<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>還日堂</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#ece5da;
font-family:"Yu Mincho",serif;
color:#17130f;
}

.hero{
position:relative;
height:100svh;
overflow:hidden;
}

.hero-bg{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center center;
filter:none;
}

.hero-overlay{
position:absolute;
inset:0;
background:linear-gradient(
180deg,
rgba(0,0,0,.04),
rgba(0,0,0,.28)
);
}

.hero-content{
position:absolute;
left:48px;
bottom:48px;
z-index:2;
color:white;
}

.hero-name{
font-size:clamp(52px,8vw,92px);
letter-spacing:.12em;
margin:0;
font-weight:400;
}

.hero-sub{
margin-top:18px;
font-size:14px;
letter-spacing:.22em;
opacity:.9;
}

@media(max-width:720px){
.hero-content{
left:28px;
bottom:32px;
}

.hero-name{
font-size:46px;
}
}
</style>
</head>

<body>

<section class="hero">

<img
class="hero-bg"
src="https://res.cloudinary.com/dvr7rww8q/image/upload/v1779978812/ChatGPT_Image_2026%E5%B9%B45%E6%9C%8828%E6%97%A5_23_32_39_2_pom5uh.png"
alt="">

<div class="hero-overlay"></div>

<div class="hero-content">

<h1 class="hero-name">
山中 一馬
</h1>

<div class="hero-sub">
鍼灸院 還日堂　院長
</div>

</div>

</section>

</body>
</html>
