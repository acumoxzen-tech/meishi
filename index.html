<script>
function saveContact(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
N:Yamanaka;Kazuma;;;
FN:山中 一馬
ORG:鍼灸院 還日堂
TITLE:鍼灸師
TEL;TYPE=CELL:07083058788
EMAIL:acumox.zen@gmail.com
URL:https://acumoxzen-tech.github.io/kanjitsudo-site/#top
NOTE:鍼灸院 還日堂 / Kazuma Yamanaka
END:VCARD`;

  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "yamanaka-kazuma.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
