<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>山中 一馬 | 伝統鍼灸</title>
  <meta name="description" content="山中一馬のプロフィール。伝統鍼灸、還日堂、各種リンク。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Kaisei+Opti:wght@400;500;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f6efe2;
      --paper2: #ebe0ce;
      --ink: #2b2822;
      --ink-soft: rgba(43,40,34,.58);
      --gold: #a7894e;
      --gold-soft: rgba(167,137,78,.32);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.82), transparent 28%),
        linear-gradient(180deg, #fbf7ee 0%, var(--paper) 52%, var(--paper2) 100%);
      font-family: "Noto Serif JP", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(90deg, rgba(43,40,34,.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(43,40,34,.022) 1px, transparent 1px);
      background-size: 14px 14px;
      z-index: -2;
    }

    /* Opening */
    .opening {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      transform: translateX(-4px);
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.9), transparent 34%),
        linear-gradient(180deg, #fbf7ee 0%, #f5eddf 58%, #eadfca 100%);
      animation: openingBgOut 1.05s ease forwards 4.15s;
    }

    .opening-stage {
      position: relative;
      width: min(92vw, 420px);
      height: min(92vw, 420px);
      display: grid;
      place-items: center;
      animation: logoFadeToBg 3s ease forwards 4.8s;
    }

    .opening-stage img {
      position: absolute;
      width: 100%;
      height: auto;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .dot-img {
      opacity: 0;
      transform: scale(.96);
      filter: blur(2px);
      animation: dotIn 1.35s cubic-bezier(.22,.72,.22,1) forwards;
      z-index: 2;
    }

    .dot-img:nth-child(1) { animation-delay: .00s; }
    .dot-img:nth-child(2) { animation-delay: .55s; }
    .dot-img:nth-child(3) { animation-delay: 1.10s; }
    .dot-img:nth-child(4) { animation-delay: 2.20s; }
    .dot-img:nth-child(5) { animation-delay: 1.65s; }

    .logo-img {
      opacity: 0;
      transform: scale(.985);
      filter: blur(5px);
      animation: logoIn 2s ease forwards 2.8s;
      z-index: 1;
    }

    @keyframes dotIn {
      0% { opacity: 0; transform: scale(.96); filter: blur(2px); }
      58% { opacity: .72; transform: scale(1.01); filter: blur(.3px); }
      100% { opacity: .9; transform: scale(1); filter: blur(0); }
    }

    @keyframes logoIn {
      0% { opacity: 0; transform: scale(.985); filter: blur(5px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes logoFadeToBg {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: .045; transform: scale(1); }
    }

    @keyframes openingBgOut {
      0% {
        background:
          radial-gradient(circle at 50% 42%, rgba(255,255,255,.9), transparent 34%),
          linear-gradient(180deg, #fbf7ee 0%, #f5eddf 58%, #eadfca 100%);
        z-index: 10;
      }
      100% {
        background: transparent;
        z-index: 0;
      }
    }

    /* Main */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      width: min(100%, 440px);
      margin: 0 auto;
      padding: max(34px, env(safe-area-inset-top)) 28px max(34px, env(safe-area-inset-bottom));
    }

    .hero {
      min-height: 74svh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      column-gap: 28px;
      align-items: center;
      justify-content: center;
      padding: 54px 0 30px;
    }

    .side-note {
      writing-mode: vertical-rl;
      justify-self: end;
      align-self: center;
      color: rgba(43,40,34,.34);
      font-size: 12px;
      letter-spacing: .32em;
      line-height: 2;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp .9s ease forwards 8.25s;
    }

    .name {
      font-family: "Shippori Mincho", serif !important;
      writing-mode: vertical-rl;
      font-size: clamp(52px, 15vw, 76px);
      letter-spacing: .16em;
      line-height: 1.1;
      font-weight: 400;
      margin: 0;
    }

    .name span {
      font-family: "Kaisei Opti", serif !important;
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
      filter: blur(2px);
      animation: letterIn .7s cubic-bezier(.2,.9,.2,1) forwards;
    }

    .name span:nth-child(1) { animation-delay: 8.15s; }
    .name span:nth-child(2) { animation-delay: 8.23s; }
    .name span:nth-child(3) { animation-delay: 8.31s; }
    .name span:nth-child(4) { animation-delay: 8.39s; }

    .copy {
      writing-mode: vertical-rl;
      justify-self: start;
      font-size: 16px;
      letter-spacing: .22em;
      line-height: 2.2;
      color: rgba(43,40,34,.76);
      margin: 0;
      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp .9s ease forwards 8.58s;
    }

    .seal {
  display:none !important;
      position: absolute;
      left: 34px;
      top: 52%;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(167,137,78,.42);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1.3;
      letter-spacing: .1em;
      transform: scale(.86) rotate(-4deg);
      opacity: 0;
      animation: stamp .55s cubic-bezier(.2,.9,.25,1.4) forwards 5.55s;
      background: rgba(255,255,255,.18);
    }

    .profile-panel {
      margin-top: 6px;
      padding: 34px 26px 28px;
      border: 1px solid rgba(167,137,78,.22);
      border-radius: 999px 999px 28px 28px;
      background: linear-gradient(
        180deg,
        #f8f3ea 0%,
        #f3ede2 100%
      );
      box-shadow: 0 26px 80px rgba(83,61,30,.12);
      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp .9s ease forwards 8.92s;
    }

    .profile-head {
      text-align: center;
      margin-bottom: 28px;
    }

    .circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(167,137,78,.28);
      margin: 0 auto 18px;
      background: #fffdf9;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .profile-head strong {
      display: block;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: .16em;
      margin-bottom: 10px;
    }

    .profile-head p {
      margin: 0;
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: .11em;
      color: var(--ink-soft);
    }

    .links {
      display: grid;
      gap: 10px;
    }

    .link {
      text-decoration: none;
      color: var(--ink);
      border: 1px solid rgba(167,137,78,.18);
      border-radius: 999px;
      padding: 15px 18px;
      background: linear-gradient(
      180deg,
      #faf6ef 0%,
      #f4ede2 100%
    );
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: .12em;
      font-size: 14px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp .55s ease forwards;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }

    .link:nth-child(1) { animation-delay: 5.92s; }
    .link:nth-child(2) { animation-delay: 6.02s; }
    .link:nth-child(3) { animation-delay: 6.12s; }
    .link:nth-child(4) { animation-delay: 6.22s; }
    .link:nth-child(5) { animation-delay: 6.32s; }

    .link em {
      font-style: normal;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .18em;
    }

    .link:active {
      transform: scale(.985);
      border-color: rgba(167,137,78,.42);
      background: rgba(255,255,255,.36);
    }

    footer {
      text-align: center;
      margin: 34px 0 28px;
      color: rgba(43,40,34,.34);
      font-size: 10px;
      letter-spacing: .26em;
      opacity: 0;
      animation: fadeIn .9s ease forwards 6.48s;
    }

    @keyframes letterIn {
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes stamp {
      to { opacity: 1; transform: scale(1) rotate(-4deg); }
    }

    @media (max-height: 720px) {
      .hero { min-height: 68svh; }
      .name { font-size: 54px; }
      .copy { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-delay: 0s !important;
        transition: none !important;
      }
      .opening {
        z-index: 0;
        background: transparent;
      }
      .opening-stage {
        opacity: .045;
      }
    }
  </style>
</head>
