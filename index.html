<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kazuma | 還日堂</title>
  <meta name="description" content="Kazuma / 還日堂 のデジタル名刺" />

  <style>
    :root{
      --ink:#161410;
      --paper:#f4efe6;
      --paper2:#e8dfd0;
      --gold:#aa8950;
      --muted:#7b7468;
      --line:rgba(22,20,16,.14);
      --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
      --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top,#fffaf0 0,#f3eadc 42%,#ded2c2 100%);
      color:var(--ink);
      font-family:var(--serif);
      letter-spacing:.04em;
    }

    .page{
      width:min(430px,100%);
      min-height:100vh;
      margin:auto;
      background:var(--paper);
      box-shadow:0 30px 80px rgba(0,0,0,.18);
      overflow:hidden;
    }

    .hero{
      height:270px;
      position:relative;
      background:
        linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.74)),
        url("./hero.png") center/cover;
    }

    .brand{
      position:absolute;
      top:24px;
      left:24px;
      color:white;
    }

    .brand-jp{
      font-size:24px;
      letter-spacing:.24em;
    }

    .brand-en{
      margin-top:6px;
      font:10px var(--sans);
      letter-spacing:.32em;
      opacity:.75;
    }

    .copy{
      position:absolute;
      left:28px;
      bottom:30px;
      writing-mode:vertical-rl;
      color:white;
      font-size:15px;
      line-height:2;
      letter-spacing:.22em;
    }

    .profile{
      padding:0 26px 26px;
      position:relative;
    }

    .avatar{
      width:112px;
      height:112px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid var(--paper);
      margin-top:-56px;
      box-shadow:0 12px 28px rgba(0,0,0,.16);
      background:#ddd;
    }

    h1{
      margin:20px 0 4px;
      font-size:31px;
      font-weight:400;
      letter-spacing:.04em;
    }

    .role{
      color:var(--muted);
      font-size:13px;
      margin-bottom:18px;
    }

    .message{
      font-size:14px;
      line-height:2;
      margin:0 0 24px;
    }

    .info{
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:18px 0;
      display:grid;
      gap:13px;
    }

    .row{
      display:grid;
      grid-template-columns:76px 1fr;
      gap:10px;
      align-items:start;
      font-family:var(--sans);
      font-size:14px;
      letter-spacing:.02em;
    }

    .label{
      color:var(--gold);
      font-size:11px;
      letter-spacing:.16em;
      text-transform:uppercase;
      padding-top:2px;
    }

    .row a{
      color:var(--ink);
      text-decoration:none;
      word-break:break-all;
    }

    .buttons{
      display:grid;
      gap:12px;
      padding:24px 0 10px;
    }

    .btn{
      height:54px;
      border-radius:999px;
      border:1px solid var(--line);
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:var(--ink);
      font:14px var(--sans);
      letter-spacing:.08em;
      background:rgba(255,255,255,.42);
      box-shadow:0 12px 26px rgba(0,0,0,.05);
    }

    .btn.primary{
      background:var(--ink);
      color:white;
      border-color:var(--ink);
    }

    .btn.gold{
      color:white;
      background:linear-gradient(135deg,#b99b64,#8e713e);
      border-color:transparent;
    }

    .links{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:12px;
    }

    .mini{
      min-height:72px;
      border-radius:18px;
      background:rgba(255,255,255,.45);
      border:1px solid rgba(255,255,255,.55);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:7px;
      text-decoration:none;
      color:var(--ink);
      font:11px var(--sans);
      box-shadow:0 10px 22px rgba(0,0,0,.04);
    }

    .mini b{
      font-size:20px;
      font-weight:400;
    }

    footer{
      padding:26px;
      text-align:center;
      font:10px var(--sans);
      letter-spacing:.18em;
      color:var(--muted);
    }

    @media (min-width:700px){
      body{
        padding:42px 0;
      }
      .page{
        border-radius:34px;
        min-height:auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="brand">
        <div class="brand-jp">還日堂</div>
        <div class="brand-en">KANJITSUDO</div>
      </div>
      <div class="copy">日常に、還る場所。</div>
    </section>

    <section class="profile">
      <img class="avatar" src="./profile.png" alt="Kazuma">

      <h1>Kazuma</h1>
      <div class="role">還日堂 主宰 / KANJITSUDO</div>

      <p class="message">
        ご縁をいただきありがとうございます。<br>
        お問い合わせ・ご連絡は下記よりお願いいたします。
      </p>

      <div class="info">
        <div class="row">
          <div class="label">TEL</div>
          <a href="tel:09012345678">090-1234-5678</a>
        </div>

        <div class="row">
          <div class="label">MAIL</div>
          <a href="mailto:info@kanjitsudo.jp">info@kanjitsudo.jp</a>
        </div>

        <div class="row">
          <div class="label">WEB</div>
          <a href="https://kanjitsudo.jp" target="_blank">kanjitsudo.jp</a>
        </div>

        <div class="row">
          <div class="label">ADDRESS</div>
          <div>東京都渋谷区〇〇 1-2-3</div>
        </div>
      </div>

      <div class="buttons">
        <button class="btn primary" onclick="saveContact()">電話帳に登録する</button>
        <a class="btn gold" href="tel:09012345678">電話をかける</a>
        <a class="btn" href="mailto:info@kanjitsudo.jp">メールを送る</a>
      </div>

      <div class="links">
        <a class="mini" href="https://instagram.com/" target="_blank">
          <b>◎</b>
          Instagram
        </a>
        <a class="mini" href="https://line.me/" target="_blank">
          <b>◉</b>
          LINE
        </a>
        <a class="mini" href="https://maps.google.com/" target="_blank">
          <b>⌖</b>
          Map
        </a>
      </div>
    </section>

    <footer>
      © KANJITSUDO
    </footer>
  </main>

  <script>
    function saveContact(){
      const vcard = `BEGIN:VCARD
VERSION:3.0
N:Kazuma;;;;
FN:Kazuma
ORG:還日堂
TITLE:主宰
TEL;TYPE=CELL:09012345678
EMAIL:info@kanjitsudo.jp
URL:https://kanjitsudo.jp
ADR;TYPE=WORK:;;東京都渋谷区〇〇 1-2-3;;;;
NOTE:還日堂 / KANJITSUDO
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "kazuma-kanjitsudo.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
