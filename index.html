<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山中 一馬 | 還日堂</title>
<meta name="description" content="還日堂 山中一馬のデジタル名刺。">
<meta property="og:title" content="山中 一馬 | 還日堂">
<meta property="og:description" content="日常に、還る場所。">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/hero.jpg">

<style>
:root{
  --ink:#17130f;
  --paper:#f4efe6;
  --paper2:#ebe4d8;
  --soft:#756e63;
  --line:rgba(23,19,15,.10);
  --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:#efe9df;
  color:var(--ink);
  font-family:var(--serif);
  letter-spacing:.045em;
}

a{color:inherit;text-decoration:none}
img{display:block;width:100%}

.page{
  width:min(100%,920px);
  margin:0 auto;
  background:var(--paper);
  box-shadow:0 26px 90px rgba(0,0,0,.12);
}

.hero{
  position:relative;
  min-height:860px;
  color:#fff;
  overflow:hidden;
  background:#050605;
}

.hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(1) contrast(1) saturate(1);
  transform:scale(1.08); object-position:center center;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:none;
  pointer-events:none;
}

.hero-nav{
  position:absolute;
  z-index:2;
  top:28px;
  left:34px;
  right:34px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}

.brand-jp{
  font-size:22px;
  letter-spacing:.28em;
  line-height:1;
  font-weight:400;
}

.brand-en{
  margin-top:7px;
  font:10px/1 var(--sans);
  letter-spacing:.34em;
  opacity:.68;
}

.lang{
  font:12px var(--sans);
  letter-spacing:.18em;
  opacity:.76;
}

.hero-copy{
  position:absolute;
  z-index:2;
  top:125px;
  left:20%;
  writing-mode:vertical-rl;
  font-size:20px;
  line-height:2.25;
  letter-spacing:.27em;
  font-weight:400;
}

.hero-logo{
  position:absolute;
  z-index:2;
  right:15%;
  top:95px;
  text-align:center;
}

.logo-mark{
  width:76px;
  height:76px;
  border:1px solid rgba(255,255,255,.76);
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 20px;
  font-size:30px;
  line-height:1;
}

.hero-title{
  writing-mode:vertical-rl;
  margin:0 auto;
  font-size:58px;
  line-height:1;
  font-weight:400;
  letter-spacing:.22em;
}

.hero-sub{
  margin-top:22px;
  font:11px var(--sans);
  letter-spacing:.28em;
  opacity:.72;
}

.profile{
  padding:56px 8.8% 72px;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:54px;
  align-items:center;
  background:
    radial-gradient(circle at 30% 15%,rgba(255,255,255,.76),transparent 36%),
    var(--paper);
}

.portrait{
  width:260px;
  height:260px;
  border-radius:50%;
  object-fit:cover;
  filter:saturate(.96) contrast(1.02);
  box-shadow:
    0 22px 50px rgba(0,0,0,.10),
    inset 0 0 0 1px rgba(255,255,255,.45);
}

.profile h1{
  margin:0 0 12px;
  font-size:35px;
  font-weight:400;
  letter-spacing:.035em;
}

.role{
  font-size:14px;
  color:var(--soft);
  margin-bottom:30px;
}

.lead{
  margin:0;
  font-size:18px;
  line-height:2.08;
}

.signature{
  margin-top:24px;
  width:180px;
  font-family:"Snell Roundhand","Zapfino",cursive;
  font-size:33px;
  transform:rotate(-7deg);
  opacity:.74;
}

.links{
  padding:42px 28px 56px;
  background:linear-gradient(180deg,var(--paper2),#eee8de);
  text-align:center;
}

.contact-action{
  margin:0 auto;
  max-width:520px;
}

.contact-action button{
  width:100%;
  min-height:58px;
  border:none;
  border-radius:999px;
  background:#111;
  color:#fff;
  font:13px var(--sans);
  letter-spacing:.16em;
  cursor:pointer;
  transition:.28s ease;
}

.contact-action button:hover{
  transform:translateY(-2px);
  opacity:.92;
}

.simple-socials{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:520px;
  margin-inline:auto;
}

.simple-social{
  aspect-ratio:1/1;
  border-radius:26px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.32)
    );
  border:1px solid rgba(255,255,255,.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  color:#17130f;
  box-shadow:
    0 18px 44px rgba(0,0,0,.05),
    inset -3px -3px 8px rgba(255,255,255,.9),
    inset 3px 3px 8px rgba(0,0,0,.03);
  transition:.28s ease;
  backdrop-filter:blur(12px);
}

.simple-social:hover{
  transform:translateY(-3px);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.9),
      rgba(255,255,255,.45)
    );
}

.social-icon{
  width:54px;
  height:54px;
  border-radius:18px;
  background:rgba(255,255,255,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset -2px -2px 5px rgba(255,255,255,.92),
    inset 2px 2px 5px rgba(0,0,0,.04);
}

.simple-social svg{
  width:24px;
  height:24px;
  stroke-width:1.25;
}

.social-label{
  font:11px var(--sans);
  letter-spacing:.14em;
  color:#5e574c;
}

.about{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:var(--paper);
}

.about-text{
  padding:62px 10%;
}

.about h2{
  margin:0 0 28px;
  font:15px var(--sans);
  letter-spacing:.22em;
  font-weight:400;
}

.about p{
  margin:0;
  font-size:16px;
  line-height:2.18;
}

.about-image{
  height:265px;
  object-fit:cover;
}

.ending{
  position:relative;
  min-height:270px;
  color:#fff;
  display:grid;
  place-items:center;
  text-align:center;
  overflow:hidden;
  background:#111;
}

.ending img{
  position:absolute;
  inset:0;
  height:100%;
  object-fit:cover;
  filter:brightness(.58) saturate(.75);
}

.ending::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.58));
}

.ending-content{
  position:relative;
  z-index:2;
}

.ending-copy{
  font-size:22px;
  line-height:2.05;
  letter-spacing:.18em;
  margin-bottom:30px;
}

.ending-mark{
  width:54px;
  height:54px;
  border:1px solid rgba(255,255,255,.72);
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
}

.ending-brand{
  font-size:23px;
  letter-spacing:.22em;
}

footer{
  background:#050605;
  color:rgba(255,255,255,.72);
  text-align:center;
  padding:17px;
  font:11px var(--sans);
  letter-spacing:.12em;
}

.reveal{
  opacity:0;
  transform:translateY(18px);
  transition:opacity .9s ease, transform .9s ease;
}

.reveal.show{
  opacity:1;
  transform:none;
}

@media(max-width:720px){
  .page{width:100%;box-shadow:none}
  .hero{min-height:620px}
  .hero-nav{top:24px;left:24px;right:24px}
  .brand-jp{font-size:20px}
  .lang{display:none}
  .hero-copy{top:112px;left:44px;font-size:15px;line-height:2}
  .hero-logo{right:34px;top:92px}
  .logo-mark{width:54px;height:54px;font-size:22px;margin-bottom:15px}
  .hero-title{font-size:38px}
  .hero-sub{font-size:9px}
  .profile{padding:42px 28px 54px;grid-template-columns:112px 1fr;gap:22px;align-items:start}
  .portrait{width:112px;height:112px}
  .profile h1{font-size:24px;margin-top:2px}
  .role{font-size:12px;margin-bottom:15px}
  .lead{font-size:12.8px;line-height:1.95}
  .signature{display:none}
  .links{padding:36px 22px 46px}
  .link-grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .link-card{min-height:78px;border-radius:13px}
  .link-card span{font-size:11px}
  .about{grid-template-columns:1fr}
  .about-text{padding:46px 28px}
  .about p{font-size:14px}
  .about-image{height:240px;order:-1}
  .menu{padding:48px 28px 62px}
  .menu-grid{grid-template-columns:1fr;gap:32px}
  .menu-item img{height:190px}
  .ending{min-height:240px}
  .ending-copy{font-size:17px}
}
</style>
</head>

<body>
<main class="page">

  <section class="hero">
    <img class="hero-bg" src="https://res.cloudinary.com/dvr7rww8q/image/upload/v1779971902/AED91218-B118-41AA-B6C0-96B8682695E5_vwpqxn.jpg" alt="">  </section>

  <section class="profile reveal">
    <img class="portrait" src="https://res.cloudinary.com/dvr7rww8q/image/upload/v1778986402/IMG_9882_fsx375.jpg" alt="Kazuma Yamanaka">
    <div>
      <h1>山中 一馬</h1>
      <div class="role">鍼灸院 還日堂　院長</div>
      <p class="lead">
        器と茶と、日々のこと。<br>
        暮らしに静かな余白をつくるものを<br>
        届けています。
      </p>
      <div class="signature">Kazuma</div>
    </div>
  </section>

  <section class="links reveal">
    <div class="contact-action">
      <button type="button" onclick="saveContact()">
        連絡帳に登録する
      </button>
    </div>

    <div class="simple-socials">

      <a class="simple-social" href="mailto:info@kanjitsudo.jp" aria-label="Mail">
        <div class="social-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
            <path d="M4.5 7l7.5 6 7.5-6"></path>
          </svg>
        </div>
        <div class="social-label">Mail</div>
      </a>

      <a class="simple-social" href="https://instagram.com/" target="_blank" aria-label="Instagram">
        <div class="social-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="5"></rect>
            <circle cx="12" cy="12" r="3.4"></circle>
            <circle cx="17.2" cy="6.8" r=".8" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
        <div class="social-label">Instagram</div>
      </a>

      <a class="simple-social" href="https://line.me/" target="_blank" aria-label="LINE">
        <div class="social-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M5.2 17.5c-1.6-1.3-2.6-3-2.6-4.9 0-4.1 4.2-7.4 9.4-7.4s9.4 3.3 9.4 7.4-4.2 7.4-9.4 7.4c-.8 0-1.6-.1-2.3-.2L5.4 21l.8-3.4z"></path>
            <path d="M7.5 10.2v4h2.1M10.8 10.2v4M12.4 14.2v-4l2.3 4v-4M17.1 10.2h-1.7v4h1.8M15.4 12.2h1.5"></path>
          </svg>
        </div>
        <div class="social-label">LINE</div>
      </a>

    </div>
  </section>

  <section class="about reveal">
    <div class="about-text">
      <h2>ABOUT</h2>
      <p>
        還日堂は、自然に還るような暮らしを<br>
        提案するブランドです。<br>
        器、茶、香り、そして日々の道具。<br>
        ひとつひとつ、心を込めて選び、届けています。
      </p>
    </div>
    <img class="about-image" src="assets/about.jpg" alt="">
  </section>

  

  <section class="ending">
    <img src="assets/ending.jpg" alt="">
    <div class="ending-content">
      <div class="ending-copy">
        還ることは、進むこと。<br>
        静けさの中に、豊かさがある。
      </div>
      <div class="ending-mark">還</div>
      <div class="ending-brand">還日堂</div>
      <div class="brand-en">KANJITSUDO</div>
    </div>
  </section>

  <footer>© KANJITSUDO. All Rights Reserved.</footer>
</main>

<script>
const targets = document.querySelectorAll(".reveal");
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting) entry.target.classList.add("show");
  });
},{threshold:.12});
targets.forEach(target => observer.observe(target));

function saveContact(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
N:Yamanaka;Kazuma;;;
FN:山中 一馬
ORG:還日堂
TITLE:鍼灸院 還日堂 院長
TEL;TYPE=CELL:07083058788
EMAIL:info@kanjitsudo.jp
URL:https://kanjitsudo.jp
NOTE:還日堂 / KANJITSUDO
END:VCARD`;

  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "yamanaka-kazuma.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
