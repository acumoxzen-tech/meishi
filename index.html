<!doctype html>
<html lang="ja">

<style>
*{box-sizing:border-box}
html{
  margin:0;
  padding:0;
  background:#efe6d8;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  padding:0;
  background:#efe6d8;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;
}
.page{
  position:relative;
  width:100%;
  max-width:430px;
  margin:0 auto;
  padding:0;
  background:#efe6d8;
  overflow:hidden;
  line-height:0;
}
.design{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
  border:0;
  user-select:none;
  -webkit-user-drag:none;
  vertical-align:top;
  transform:translateY(-34px);
  margin-bottom:-34px;
}
.hotspot{
  position:absolute;
  z-index:10;
  display:block;
  background:rgba(255,255,255,0);
  border:0;
  padding:0;
  margin:0;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

/* 画像を上に 34px 詰めた分、リンク判定も同じだけ上へ補正 */
.contact{
  left:19.0%;
  top:calc(66.5% - 14px);
  width:62.0%;

}
.mail{
  left:19.0%;

  width:19.5%;
  height:9.2%;
  border-radius:14px;
}
.instagram{
  left:40.4%;
  top:calc(74.2% - 14px);
  width:19.5%;
  height:9.2%;
  border-radius:14px;
}
.line{
  left:61.7%;
  top:calc(74.2% - 14px);
  width:19.5%;
  height:9.2%;
  border-radius:14px;
}
.website{
  left:18.5%;
  top:calc(84.1% - 14px);
  width:63.0%;
  height:6.2%;
  border-radius:999px;
}

@media(min-width:431px){
  .page{box-shadow:0 30px 100px rgba(0,0,0,.14)}

</style>
</head>

<body>
<main class="page">
  <img class="design" src="design.png" alt="山中一馬 鍼灸院還日堂 デジタル名刺">

  <button class="hotspot contact" type="button" aria-label="連絡帳に登録する" onclick="saveContact()"></button>

  <a class="hotspot mail" href="mailto:acumox.zen@gmail.com" aria-label="Mail"></a>

  <a class="hotspot instagram" href="https://instagram.com/k__.z.__m" target="_blank" rel="noopener" aria-label="Instagram"></a>

  <a class="hotspot line" href="https://line.me/ti/p/_eYXUVPcDW" target="_blank" rel="noopener" aria-label="LINE"></a>

  <a class="hotspot website" href="https://acumoxzen-tech.github.io/kanjitsudo-site/" target="_blank" rel="noopener" aria-label="還日堂公式サイト"></a>
</main>

<script>
function saveContact(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
N:山中;一馬;;;
FN:山中 一馬
X-PHONETIC-LAST-NAME:やまなか
X-PHONETIC-FIRST-NAME:かずま
TEL;TYPE=CELL:07083058788
EMAIL:acumox.zen@gmail.com
URL:https://acumoxzen-tech.github.io/kanjitsudo-site/
END:VCARD`;

  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "yamanaka-kazuma.vcf";

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}
</script>
