<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山中 一馬 | 鍼灸院 還日堂</title>

<style>
:root{
  --ink:#17130f;
  --sub:#756f66;
  --paper:#f6f1e8;
  --paper2:#eee7dc;
  --line:rgba(23,19,15,.10);
  --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ece5da;
  color:var(--ink);
  font-family:var(--serif);
  letter-spacing:.045em;
}

a{
  color:inherit;
  text-decoration:none;
}

.page{
  width:min(100%,920px);
  margin:0 auto;
  background:var(--paper);
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.10);
}

/* HERO */

.hero{
  position:relative;
  min-height:100svh;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:48px;
  color:#fff;
}

.hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.82) contrast(1.02);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
  linear-gradient(
    180deg,
    rgba(0,0,0,.06),
    rgba(0,0,0,.42)
  );
}

.hero-inner{
  position:relative;
  z-index:2;
  width:100%;
}

.brand{
  position:absolute;
  top:0;
  right:0;
  text-align:right;
}

.brand .jp{
  font-size:14px;
  letter-spacing:.34em;
}

.brand .en{
  margin-top:10px;
  font:10px var(--sans);
  letter-spacing:.24em;
  opacity:.68;
}

.hero-name{
  margin:0;
  font-size:clamp(48px,8vw,92px);
  line-height:1.1;
  letter-spacing:.14em;
  font-weight:400;
}

.hero-roman{
  margin-top:18px;
  font:12px var(--sans);
  letter-spacing:.32em;
  opacity:.8;
}

.hero-role{
  margin-top:28px;
  padding-left:18px;
  border-left:1px solid rgba(255,255,255,.34);
  font-size:14px;
  line-height:2;
  color:rgba(255,255,255,.82);
}

/* PROFILE */

.profile{
  padding:64px 72px 56px;
  display:grid;
  grid-template-columns:190px 1fr;
  gap:44px;
  align-items:center;
}

.portrait{
  width:190px;
  height:190px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 22px 52px rgba(0,0,0,.12);
}

.profile h2{
  margin:0 0 14px;
  font-size:28px;
  font-weight:400;
}

.profile .role{
  margin-bottom:22px;
  font:13px var(--sans);
  letter-spacing:.16em;
  color:var(--sub);
}

.lead{
  margin:0;
  line-height:2.1;
  font-size:16px;
}

/* LINKS */

.links{
  padding:46px 72px 58px;
  background:linear-gradient(180deg,var(--paper2),#f1ece4);
}

.contact-action{
  max-width:520px;
  margin:0 auto;
}

.contact-action button{
  width:100%;
  min-height:58px;
  border:none;
  border-radius:999px;
  background:#17130f;
  color:#fff;
  font:13px var(--sans);
  letter-spacing:.18em;
  cursor:pointer;
}

.simple-socials{
  margin:18px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:520px;
}

.simple-social{
  aspect-ratio:1/1;
  border-radius:26px;
  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.78),
    rgba(255,255,255,.34)
  );
  border:1px solid rgba(255,255,255,.82);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  box-shadow:
    0 18px 44px rgba(0,0,0,.04),
    inset -3px -3px 8px rgba(255,255,255,.9),
    inset 3px 3px 8px rgba(0,0,0,.03);
}

.social-icon{
  width:54px;
  height:54px;
  border-radius:18px;
  background:rgba(255,255,255,.52);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.social-label{
  font:11px var(--sans);
  letter-spacing:.14em;
  color:var(--sub);
}

/* ABOUT */

.about{
  padding:78px 72px;
}

.section-title{
  margin:0 0 28px;
  font:13px var(--sans);
  letter-spacing:.28em;
  color:var(--sub);
}

.about p{
  margin:0;
  max-width:640px;
  line-height:2.25;
}

/* END */

.ending{
  min-height:300px;
  display:grid;
  place-items:center;
  text-align:center;
  background:#15130f;
  color:#fff;
  padding:64px 28px;
}

.ending-copy{
  font-size:22px;
  line-height:2;
  margin-bottom:30px;
}

footer{
  background:#0b0907;
  color:rgba(255,255,255,.58);
  text-align:center;
  padding:16px;
  font:11px var(--sans);
}

@media(max-width:720px){

.page{
  box-shadow:none;
}

.hero{
  min-height:82svh;
  padding:28px;
}

.profile{
  padding:52px 28px 48px;
  grid-template-columns:116px 1fr;
  gap:22px;
}

.portrait{
  width:116px;
  height:116px;
}

.profile h2{
  font-size:24px;
}

.lead{
  font-size:13px;
}

.links{
  padding:42px 24px 50px;
}

.about{
  padding:58px 28px;
}

}
</style>
</head>

<body>

<main class="page">

<section class="hero">

<img
class="hero-bg"
src="https://res.cloudinary.com/dvr7rww8q/image/upload/v1779978812/ChatGPT_Image_2026%E5%B9%B45%E6%9C%8828%E6%97%A5_23_32_39_2_pom5uh.png"
alt="">

<div class="hero-inner">

<div class="brand">
<div class="jp">還日堂</div>
<div class="en">KANJITSUDŌ</div>
</div>

<h1 class="hero-name">
山中 一馬
</h1>

<div class="hero-roman">
Kazuma Yamanaka
</div>

<div class="hero-role">
鍼灸院 還日堂　院長
</div>

</div>

</section>

<section class="profile">

<img
class="portrait"
src="https://res.cloudinary.com/dvr7rww8q/image/upload/v1778986402/IMG_9882_fsx375.jpg">

<div>

<h2>
山中 一馬
</h2>

<div class="role">
鍼灸院 還日堂　院長
</div>

<p class="lead">
からだの声に耳を澄ませ、<br>
日々の緊張をほどき、<br>
その人らしい巡りへ還す。
</p>

</div>

</section>

<section class="links">

<div class="contact-action">
<button onclick="saveContact()">
連絡帳に登録する
</button>
</div>

<div class="simple-socials">

<a class="simple-social" href="mailto:info@kanjitsudo.jp">
<div class="social-icon">✉</div>
<div class="social-label">Mail</div>
</a>

<a class="simple-social" href="https://instagram.com/" target="_blank">
<div class="social-icon">◎</div>
<div class="social-label">Instagram</div>
</a>

<a class="simple-social" href="https://line.me/" target="_blank">
<div class="social-icon">◇</div>
<div class="social-label">LINE</div>
</a>

</div>

</section>

<section class="about">

<h2 class="section-title">
ABOUT
</h2>

<p>
還日堂は、日々の疲れや滞りを静かに整え、<br>
本来のからだの巡りへ還るための場所です。<br>
鍼灸を通して、心身に余白が戻る時間をお届けします。
</p>

</section>

<section class="ending">

<div>

<div class="ending-copy">
還ることは、進むこと。<br>
静けさの中に、豊かさがある。
</div>

<div>
還日堂
</div>

</div>

</section>

<footer>
© KANJITSUDŌ
</footer>

</main>

<script>
function saveContact(){

const vcard = `BEGIN:VCARD
VERSION:3.0
N:Yamanaka;Kazuma;;;
FN:山中 一馬
ORG:鍼灸院 還日堂
TITLE:院長
TEL;TYPE=CELL:07083058788
EMAIL:info@kanjitsudo.jp
END:VCARD`;

const blob = new Blob([vcard], {
type:"text/vcard;charset=utf-8"
});

const url = URL.createObjectURL(blob);

const a = document.createElement("a");

a.href = url;
a.download = "yamanaka-kazuma.vcf";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(url);

}
</script>

</body>
</html>
